name = "sevendays-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# TODO once provisioned:
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "sevendays-media"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   DATABASE_URL
#   BETTER_AUTH_SECRET
#   NOTICE_API_KEY
#   SENTRY_DSN
#   POSTHOG_API_KEY

[vars]
ENVIRONMENT = "development"
# SITE_ORIGIN is a plain per-environment Worker var (the confirmation
# email's CTA origin — issue #47), not a committed [vars] entry: a localhost
# value here would deploy a wrong link. Dev value lives in .dev.vars;
# NOTICE_API_KEY stays a secret (`wrangler secret put`).

[dev]
port = 8787
