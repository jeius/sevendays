name: CI

# CI is the first of ADR-0015's two locks: it runs on main and on the v1
# branch (the v1 triggers are dormant until the seed creates the branch, and
# the typed cascade then fails any incomplete booking cut). The second lock —
# the branch-keyed continuous deploy — lives in the deploy jobs below.
on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sevendays_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sevendays_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sevendays_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared config package
        run: pnpm build:packages

      # The api-client resolves AppType through @sevendays/api's ./app export,
      # whose types point at the built dist/index.d.ts — so apps/api must be
      # built before anything that typechecks the client.
      - name: Build apps/api
        run: pnpm --filter @sevendays/api build

      - name: Lint, format, typecheck, test
        run: pnpm check

      - name: Build all apps and packages
        run: pnpm build

  # ADR-0015's second lock: the branch-keyed continuous deploy. Each leg is
  # gated on the same push's check job (needs:), fires only on its branch's
  # push, and draws its secrets from its own GitHub environment — the teaser
  # (main, the owner's booking-bearing deployment) and v1 (the private
  # booking-free deploy, dormant until the seed lands). The legs never share
  # a Worker target, a token, or a DATABASE_URL: the --name flags pin the six
  # targets and the environment scopes do the isolation. When M6 provisions
  # the dedicated accounts, the v1 leg rotates by swapping the v1
  # environment's secret values (token + DATABASE_URL + API_URL var) — no
  # workflow edit.
  deploy-teaser:
    name: Deploy teaser (main)
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: teaser
    concurrency:
      group: deploy-teaser
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_URL: ${{ vars.API_URL }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared config package
        run: pnpm build:packages

      # Same proven prefix as the check job (see its in-file comment).
      - name: Build apps/api
        run: pnpm --filter @sevendays/api build

      - name: Build landing and admin
        run: |
          pnpm --filter @sevendays/landing run build
          pnpm --filter @sevendays/admin run build

      - name: Deploy api (sevendays-api)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --name sevendays-api --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --var "MEDIA_PUBLIC_BASE_URL:$MEDIA_PUBLIC_BASE_URL"

      - name: Sync api DATABASE_URL from the environment secret
        working-directory: apps/api
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::DATABASE_URL secret missing from the teaser GitHub environment'
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name sevendays-api

      - name: Sync api R2 S3-token secrets (skip until the owner mints them)
        working-directory: apps/api
        run: |
          if [ -z "$R2_S3_ACCESS_KEY_ID" ] || [ -z "$R2_S3_SECRET_ACCESS_KEY" ]; then
            echo '::notice::R2 S3-token secrets missing from the teaser GitHub environment — presign stays loudly unavailable (docs/media-bucket-runbook.md § Owner handoff)'
            exit 0
          fi
          printf '%s' "$R2_S3_ACCESS_KEY_ID" | pnpm exec wrangler secret put R2_S3_ACCESS_KEY_ID --name sevendays-api
          printf '%s' "$R2_S3_SECRET_ACCESS_KEY" | pnpm exec wrangler secret put R2_S3_SECRET_ACCESS_KEY --name sevendays-api

      - name: Deploy landing (sevendays-landing)
        working-directory: apps/landing
        run: pnpm exec wrangler deploy --name sevendays-landing --var "API_URL:$API_URL"

      - name: Deploy admin (sevendays-admin)
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --name sevendays-admin --var "API_URL:$API_URL" --var "BETTER_AUTH_URL:$BETTER_AUTH_URL"

      - name: Sync admin DATABASE_URL from the environment secret
        working-directory: apps/admin
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::DATABASE_URL secret missing from the teaser GitHub environment'
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name sevendays-admin

  deploy-v1:
    name: Deploy v1 (private)
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v1' }}
    runs-on: ubuntu-latest
    environment: v1
    concurrency:
      group: deploy-v1
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_URL: ${{ vars.API_URL }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
      R2_S3_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      R2_S3_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared config package
        run: pnpm build:packages

      - name: Build apps/api
        run: pnpm --filter @sevendays/api build

      - name: Build landing and admin
        run: |
          pnpm --filter @sevendays/landing run build
          pnpm --filter @sevendays/admin run build

      - name: Deploy api (sevendays-v1-api)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --name sevendays-v1-api --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --var "MEDIA_PUBLIC_BASE_URL:$MEDIA_PUBLIC_BASE_URL"

      - name: Sync api DATABASE_URL from the environment secret
        working-directory: apps/api
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::DATABASE_URL secret missing from the v1 GitHub environment'
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name sevendays-v1-api

      - name: Sync api R2 S3-token secrets (skip until the owner mints them)
        working-directory: apps/api
        run: |
          if [ -z "$R2_S3_ACCESS_KEY_ID" ] || [ -z "$R2_S3_SECRET_ACCESS_KEY" ]; then
            echo '::notice::R2 S3-token secrets missing from the v1 GitHub environment — presign stays loudly unavailable (docs/media-bucket-runbook.md § Owner handoff)'
            exit 0
          fi
          printf '%s' "$R2_S3_ACCESS_KEY_ID" | pnpm exec wrangler secret put R2_S3_ACCESS_KEY_ID --name sevendays-v1-api
          printf '%s' "$R2_S3_SECRET_ACCESS_KEY" | pnpm exec wrangler secret put R2_S3_SECRET_ACCESS_KEY --name sevendays-v1-api

      - name: Deploy landing (sevendays-v1-landing)
        working-directory: apps/landing
        run: pnpm exec wrangler deploy --name sevendays-v1-landing --var "API_URL:$API_URL"

      - name: Deploy admin (sevendays-v1-admin)
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --name sevendays-v1-admin --var "API_URL:$API_URL" --var "BETTER_AUTH_URL:$BETTER_AUTH_URL"

      - name: Sync admin DATABASE_URL from the environment secret
        working-directory: apps/admin
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo '::error::DATABASE_URL secret missing from the v1 GitHub environment'
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name sevendays-v1-admin
